name: Feature request
description: Suggest an improvement for Tagingly
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this solve for organizers or attendees?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Open-source core (this repo)
        - Hosted product only (out of scope here)
        - Not sure
    validations:
      required: true
