name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # API build: prisma generate + tsc (no DB connection at build time)
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      # Web build: Auth.js requires a secret at build time
      AUTH_SECRET: ci-build-auth-secret-minimum-32-chars
      NEXTAUTH_URL: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check-types

      - name: Build
        run: npm run build
